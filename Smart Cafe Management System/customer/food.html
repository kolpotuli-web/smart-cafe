<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartCafe | Customize</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;background:#faf7f1;color:#18243a;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:28px 20px}.back{color:#18243a;text-decoration:none;font-weight:700}.card{margin-top:20px;background:#fff;border:1px solid #e5ded2;border-radius:20px;overflow:hidden}.hero{height:280px;background:#eee}.hero img{width:100%;height:100%;object-fit:cover}.body{padding:25px}.eyebrow{color:#b96516;font-size:12px;font-weight:800;letter-spacing:1.8px}.desc{color:#697386;line-height:1.6}.section{border-top:1px solid #eee7dd;padding-top:20px;margin-top:22px}.options{display:grid;gap:9px}.option{display:flex;justify-content:space-between;padding:12px;border:1px solid #ddd4c7;border-radius:10px}.qty{display:flex;align-items:center;gap:12px}.qty button{width:34px;height:34px;border:1px solid #ddd4c7;background:#fff;border-radius:9px}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:24px 0}.add{width:100%;padding:14px;border:0;border-radius:11px;background:#e88924;color:#fff;font-weight:800;cursor:pointer}.error{color:#b64b35;font-size:14px}</style></head><body><div class="wrap"><a class="back" href="menu.html">← Back to menu</a><div id="app" class="card"></div></div><script src="js/data.js"></script><script src="js/common.js"></script><script>const itemId=new URLSearchParams(location.search).get('id');const item=SmartCafeData.menu.find(x=>x.id===itemId);let quantity=1;function imageFor(){return item?.image||'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=900&q=80'}function unitPrice(){let p=Number(item.price);const s=document.querySelector('input[name="size"]:checked')?.value;if(s==='Medium')p+=20;if(s==='Large')p+=40;document.querySelectorAll('input[data-price]:checked').forEach(x=>p+=Number(x.dataset.price));return p}function updateTotal(){document.getElementById('total').textContent='₹'+(unitPrice()*quantity).toFixed(2)}function changeQty(delta){quantity=Math.max(1,Math.min(10,quantity+delta));document.getElementById('qty').textContent=quantity;updateTotal()}function addToCart(){const extras=[...document.querySelectorAll('input[data-price]:checked')].map(x=>({name:x.dataset.name,price:Number(x.dataset.price)}));const size=document.querySelector('input[name="size"]:checked').value;const cart=SmartCafeCommon.getCart();cart.push({cartId:Date.now(),id:item.id,name:item.name,price:item.price,image:item.image||'',size,extras,instructions:document.getElementById('instructions').value.trim(),quantity});SmartCafeCommon.setCart(cart);location.href='cart.html'}if(!item){document.getElementById('app').innerHTML='<div class="body"><h1>Food item not found</h1><a href="menu.html">Return to menu</a></div>'}else{document.getElementById('app').innerHTML=`<div class="hero"><img src="${imageFor()}" alt="${item.name}"></div><div class="body"><div class="eyebrow">${item.category}</div><h1>${item.name}</h1><p class="desc">${item.description}</p><div class="section"><h3>Choose size</h3><div class="options"><label class="option"><span><input type="radio" name="size" value="Small" checked> Small</span><strong>+₹0</strong></label><label class="option"><span><input type="radio" name="size" value="Medium"> Medium</span><strong>+₹20</strong></label><label class="option"><span><input type="radio" name="size" value="Large"> Large</span><strong>+₹40</strong></label></div></div><div class="section"><h3>Extras</h3><div class="options"><label class="option"><span><input type="checkbox" data-name="Extra Cheese" data-price="30"> Extra Cheese</span><strong>+₹30</strong></label><label class="option"><span><input type="checkbox" data-name="Extra Sauce" data-price="20"> Extra Sauce</span><strong>+₹20</strong></label><label class="option"><span><input type="checkbox" data-name="Extra Topping" data-price="40"> Extra Topping</span><strong>+₹40</strong></label></div></div><div class="section"><h3>Special instructions</h3><textarea id="instructions" rows="4" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd4c7;border-radius:10px" placeholder="Less spicy, no onions, etc."></textarea></div><div class="section"><h3>Quantity</h3><div class="qty"><button onclick="changeQty(-1)">−</button><strong id="qty">1</strong><button onclick="changeQty(1)">+</button></div></div><div class="total"><span>Total</span><span id="total">₹${item.price.toFixed(2)}</span></div><p class="error" id="error"></p><button class="add" onclick="addToCart()">Add to Cart</button></div>`;document.querySelectorAll('input[name="size"],input[data-price]').forEach(x=>x.addEventListener('change',updateTotal))}</script></body></html>
