<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartCafe | Customize</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{margin:0;background:#faf7f1;color:#18243a;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:800;text-decoration:none;color:#18243a}.brand span{color:#e88924}.back{color:#18243a;text-decoration:none;font-weight:700}.card{margin-top:20px;background:#fff;border:1px solid #e5ded2;border-radius:20px;overflow:hidden}.hero{height:300px;background:#eee}.hero img{width:100%;height:100%;object-fit:cover}.body{padding:25px}.eyebrow{color:#b96516;font-size:12px;font-weight:800;letter-spacing:1.8px}.desc{color:#697386;line-height:1.6}.section{border-top:1px solid #eee7dd;padding-top:20px;margin-top:22px}.section h3{margin:0 0 12px}.options{display:grid;gap:9px}.option{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid #ddd4c7;border-radius:10px;cursor:pointer}.option:hover{border-color:#c8b49d;background:#fffaf3}.option input{margin-right:8px}.qty{display:flex;align-items:center;gap:12px}.qty button{width:34px;height:34px;border:1px solid #ddd4c7;background:#fff;border-radius:9px;cursor:pointer}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:24px 0}.add{width:100%;padding:14px;border:0;border-radius:11px;background:#e88924;color:#fff;font-weight:800;cursor:pointer}.error{color:#b64b35;font-size:14px;min-height:18px}.muted{color:#697386}@media(max-width:600px){.hero{height:230px}.body{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<a class="back" href="menu.html">Back to menu</a>
<a class="brand" href="../../index.html" aria-label="Return to SmartCafe main page">Smart<span>Cafe</span></a>
</header>
<div id="app" class="card"></div>
</div>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
const params=new URLSearchParams(location.search);
const itemId=params.get('id');
const item=SmartCafeData.menu.find(x=>String(x.id)===String(itemId));
let quantity=1;

function imageFor(){return item&&item.image?item.image:'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=900&q=80'}
function selectedSize(){const selected=document.querySelector('input[name="size"]:checked');return selected?selected.value:'Regular'}
function selectedSizeCharge(){const selected=document.querySelector('input[name="size"]:checked');return selected?Number(selected.dataset.price||0):0}
function unitPrice(){
  if(!item)return 0;
  let price=Number(item.price)||0;
  price+=selectedSizeCharge();
  document.querySelectorAll('input[data-extra-price]:checked').forEach(x=>price+=Number(x.dataset.extraPrice)||0);
  return price;
}
function updateTotal(){
  const total=document.getElementById('total');
  if(total)total.textContent='₹'+(unitPrice()*quantity).toFixed(2);
}
function changeQty(delta){
  quantity=Math.max(1,Math.min(10,quantity+delta));
  document.getElementById('qty').textContent=quantity;
  updateTotal();
}
function addToCart(){
  if(!item)return;
  const extras=[...document.querySelectorAll('input[data-extra-price]:checked')].map(x=>({name:x.dataset.name,price:Number(x.dataset.extraPrice)||0}));
  const size=selectedSize();
  const cart=SmartCafeCommon.getCart();
  cart.push({cartId:Date.now(),id:item.id,name:item.name,price:Number(item.price)||0,image:item.image||'',size,extras,instructions:document.getElementById('instructions').value.trim(),quantity});
  SmartCafeCommon.setCart(cart);
  location.href='cart.html';
}
function renderOptionLists(){
  const sizes=Array.isArray(item.sizes)&&item.sizes.length?item.sizes:[['Regular',0]];
  const extras=Array.isArray(item.extras)?item.extras:[];
  const sizeHtml=sizes.map((s,i)=>`<label class="option"><span><input type="radio" name="size" value="${s[0]}" data-price="${Number(s[1])||0}" ${i===0?'checked':''}>${s[0]}</span><strong>${Number(s[1])>0?'+₹'+Number(s[1]).toFixed(0):'+₹0'}</strong></label>`).join('');
  const extraHtml=extras.length?extras.map(e=>`<label class="option"><span><input type="checkbox" data-name="${e[0]}" data-extra-price="${Number(e[1])||0}">${e[0]}</span><strong>+₹${Number(e[1]||0).toFixed(0)}</strong></label>`).join(''):'<p class="muted">No extras available for this item.</p>';
  return {sizeHtml,extraHtml};
}
if(!item){
  document.getElementById('app').innerHTML='<div class="body"><h1>Food item not found</h1><p class="muted">The selected menu item is unavailable.</p><a href="menu.html">Return to menu</a></div>';
}else{
  const options=renderOptionLists();
  document.getElementById('app').innerHTML=`
  <div class="hero"><img src="${imageFor()}" alt="${item.name}"></div>
  <div class="body">
    <div class="eyebrow">${item.category}</div>
    <h1>${item.name}</h1>
    <p class="desc">${item.description}</p>
    <div class="section"><h3>Choose size</h3><div class="options">${options.sizeHtml}</div></div>
    <div class="section"><h3>Extras</h3><div class="options">${options.extraHtml}</div></div>
    <div class="section"><h3>Special instructions</h3><textarea id="instructions" rows="4" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd4c7;border-radius:10px;font:inherit" placeholder="Less spicy, no onions, etc."></textarea></div>
    <div class="section"><h3>Quantity</h3><div class="qty"><button type="button" onclick="changeQty(-1)" aria-label="Decrease quantity">−</button><strong id="qty">1</strong><button type="button" onclick="changeQty(1)" aria-label="Increase quantity">+</button></div></div>
    <div class="total"><span>Total</span><span id="total">₹${Number(item.price).toFixed(2)}</span></div>
    <p class="error" id="error"></p>
    <button class="add" type="button" onclick="addToCart()">Add to Cart</button>
  </div>`;
  document.querySelectorAll('input[name="size"],input[data-extra-price]').forEach(x=>x.addEventListener('change',updateTotal));
  updateTotal();
}
</script>
</body>
</html>
