<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartCafe | Checkout</title><style>body{margin:0;background:#f8f5ef;color:#18243a;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 20px}.card{background:#fff;border:1px solid #e5ded2;border-radius:18px;padding:24px;margin-top:20px}label{display:block;font-weight:700;margin:16px 0 7px}input,textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd4c7;border-radius:10px;font:inherit}textarea{min-height:90px}.methods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.method{border:1px solid #ddd4c7;padding:14px;border-radius:10px}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:800;margin:20px 0}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#e88924;color:#fff;font-weight:800;cursor:pointer}.error{color:#b64b35;font-size:14px}.back{color:#18243a;text-decoration:none}@media(max-width:550px){.methods{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><a class="back" href="cart.html">← Back to cart</a><div class="card"><h1>Checkout</h1><p>Table <strong id="table"></strong></p><div id="order"></div><label for="name">Name</label><input id="name" placeholder="Your name" autocomplete="name"><label for="phone">Phone</label><input id="phone" placeholder="10-digit mobile number" inputmode="numeric"><label>Payment Method</label><div class="methods"><label class="method"><input type="radio" name="payment" value="Cash at Counter" checked> Cash at Counter</label><label class="method"><input type="radio" name="payment" value="UPI"> UPI</label><label class="method"><input type="radio" name="payment" value="Card"> Card</label><label class="method"><input type="radio" name="payment" value="Pay at Table"> Pay at Table</label></div><label for="note">Order note</label><textarea id="note" placeholder="Anything the kitchen should know?"></textarea><div class="total"><span>Total</span><span id="total">₹0.00</span></div><p id="error" class="error"></p><button class="btn" onclick="place()">Place Order</button></div></div>
<script src="js/common.js"></script><script>const c=SmartCafeCommon.getCart();document.getElementById('table').textContent=SmartCafeCommon.getTable();if(!c.length){location.href='menu.html'}else{document.getElementById('order').innerHTML=c.map(x=>`<p>${x.name} × ${x.quantity}</p>`).join('');document.getElementById('total').textContent='₹'+SmartCafeCommon.cartTotal().toFixed(2)}function place(){const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),error=document.getElementById('error');if(!name||!/^[0-9]{10}$/.test(phone)){error.textContent='Please enter your name and a valid 10-digit phone number.';return}const order=SmartCafeCommon.createOrder(c);order.customerName=name;order.phone=phone;order.payment=document.querySelector('input[name="payment"]:checked').value;order.note=document.getElementById('note').value.trim();const orders=JSON.parse(localStorage.getItem('smartCafeOrders')||'[]');orders[0]=order;localStorage.setItem('smartCafeOrders',JSON.stringify(orders));localStorage.setItem('smartCafeLastOrderId',order.id);location.href='order-status.html?order='+encodeURIComponent(order.id)}</script></body></html>
