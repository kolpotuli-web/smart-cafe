<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartCafe | Checkout</title><style>body{margin:0;background:#faf7f1;color:#18243a;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:28px 20px}.back{color:#18243a;text-decoration:none;font-weight:700}.card{background:#fff;border:1px solid #e5ded2;border-radius:19px;padding:25px;margin-top:20px}label{display:block;font-weight:700;margin:16px 0 7px}input,textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd4c7;border-radius:10px;font:inherit}.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}.method{border:1px solid #ddd4c7;border-radius:10px;padding:13px}.method input{width:auto}.summary{border-top:1px solid #eee7dd;margin-top:20px;padding-top:15px}.line{display:flex;justify-content:space-between;gap:10px;margin:8px 0}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:22px 0}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#e88924;color:#fff;font-weight:800;cursor:pointer}.error{color:#b64b35;min-height:20px}@media(max-width:550px){.methods{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="cart.html">← Back to cart</a><section class="card"><h1>Checkout</h1><p>Table <strong id="table"></strong></p><div id="summary" class="summary"></div><label for="name">Name</label><input id="name" autocomplete="name" placeholder="Your name"><label for="phone">Phone</label><input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"><label>Payment Method</label><div class="methods"><label class="method"><input type="radio" name="payment" value="Cash at Counter" checked> Cash at Counter</label><label class="method"><input type="radio" name="payment" value="UPI"> UPI</label><label class="method"><input type="radio" name="payment" value="Card"> Card</label><label class="method"><input type="radio" name="payment" value="Pay at Table"> Pay at Table</label></div><label for="note">Order note</label><textarea id="note" placeholder="Anything the kitchen should know?"></textarea><div class="total"><span>Total</span><span id="total">₹0.00</span></div><p id="error" class="error"></p><button class="btn" onclick="placeOrder()">Place Order</button></section></div><script src="js/common.js"></script><script>const cart=SmartCafeCommon.getCart();document.getElementById('table').textContent=SmartCafeCommon.getTable();function calculateTotal(){return cart.reduce((sum,item)=>{const unitPrice=SmartCafeCommon.itemUnitPrice(item);const quantity=Math.max(1,Number(item.quantity)||1);return sum+(unitPrice*quantity)},0)}function renderCheckout(){if(!cart.length){location.replace('menu.html');return}document.getElementById('summary').innerHTML=cart.map(x=>{const quantity=Math.max(1,Number(x.quantity)||1);const lineTotal=SmartCafeCommon.itemUnitPrice(x)*quantity;return `<div class="line"><span>${x.name} × ${quantity}${x.size&&x.size!=='Small'?' · '+x.size:''}</span><strong>₹${lineTotal.toFixed(2)}</strong></div>`}).join('');document.getElementById('total').textContent='₹'+calculateTotal().toFixed(2)}function placeOrder(){const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),error=document.getElementById('error');if(!name){error.textContent='Please enter your name.';return}if(!/^[0-9]{10}$/.test(phone)){error.textContent='Please enter a valid 10-digit phone number.';return}const order=SmartCafeCommon.createOrder(cart);order.customerName=name;order.phone=phone;order.payment=document.querySelector('input[name="payment"]:checked').value;order.note=document.getElementById('note').value.trim();let orders=[];try{orders=JSON.parse(localStorage.getItem('smartCafeOrders')||'[]')}catch{orders=[]}const index=orders.findIndex(x=>x.id===order.id);if(index>=0)orders[index]=order;else orders.unshift(order);localStorage.setItem('smartCafeOrders',JSON.stringify(orders));localStorage.setItem('smartCafeLastOrderId',order.id);location.href='order-status.html?order='+encodeURIComponent(order.id)}renderCheckout();</script></body></html>
