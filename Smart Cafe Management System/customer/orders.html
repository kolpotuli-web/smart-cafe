<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartCafe | My Orders</title><style>body{margin:0;background:#faf7f1;color:#18243a;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top a{font-weight:700;color:#18243a}.panel,.order{background:#fff;border:1px solid #e5ded2;border-radius:17px;padding:20px}.order{margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#697386}.badge{padding:7px 10px;border-radius:999px;background:#fff2df;color:#a85f18;font-size:11px;font-weight:800}.btn{display:inline-block;padding:10px 14px;border-radius:9px;background:#e88924;color:#fff;text-decoration:none;font-weight:800}.empty{text-align:center;padding:35px}.items{color:#697386;line-height:1.7;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:600px){.row{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><header class="top"><strong>☕ SmartCafe</strong><a href="menu.html">Menu</a></header><section class="panel"><h1>My Orders</h1><p class="muted">Orders saved in this browser prototype.</p><div id="orders"></div></section></div><script>function read(){try{return JSON.parse(localStorage.getItem('smartCafeOrders')||'[]')}catch{return[]}}function render(){const orders=read(),box=document.getElementById('orders');box.innerHTML=orders.length?orders.map(o=>`<article class="order"><div class="row"><strong>#${o.id}</strong><span class="badge">${o.status}</span></div><p class="muted">Table ${o.table} · ${new Date(o.createdAt).toLocaleString()}${o.customerName?' · '+o.customerName:''}</p><div class="items">${(o.items||[]).map(x=>`${x.name||x[0]} × ${x.quantity||x[1]}${x.size&&x.size!=='Small'?' · '+x.size:''}`).join('<br>')}</div><div class="row"><strong>₹${Number(o.total||0).toFixed(2)}</strong><a class="btn" href="order-status.html?order=${encodeURIComponent(o.id)}">Track Order</a></div></article>`).join(''):'<div class="empty"><h2>No orders yet</h2><p class="muted">Add food from the menu to place your first order.</p><a class="btn" href="menu.html">Browse Menu</a></div>'}render();window.addEventListener('storage',render);setInterval(render,3000);</script></body></html>
