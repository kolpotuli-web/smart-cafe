<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartCafe | My Orders</title><style>body{margin:0;background:#f8f5ef;color:#18243a;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #e5ded2;border-radius:18px;padding:20px;margin-top:18px}.order{border:1px solid #eee7dd;border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px}.badge{font-size:12px;font-weight:800;background:#fff2df;color:#a95d0a;padding:7px 10px;border-radius:999px}.btn{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:9px;background:#e88924;color:#fff;text-decoration:none;font-weight:700}.muted{color:#6b7280}.empty{text-align:center;padding:35px}</style></head><body><div class="wrap"><header class="top"><strong>☕ SmartCafe</strong><a href="menu.html">Menu</a></header><div class="card"><h1>My Orders</h1><div id="orders"></div></div></div><script>const orders=JSON.parse(localStorage.getItem('smartCafeOrders')||'[]');document.getElementById('orders').innerHTML=orders.length?orders.map(o=>`<article class="order"><div class="row"><strong>${o.id}</strong><span class="badge">${o.status}</span></div><p class="muted">Table ${o.table} · ${new Date(o.createdAt).toLocaleString()}</p><p>${(o.items||[]).map(x=>`${x.name||x[0]} × ${x.quantity||x[1]}`).join(' · ')}</p><div class="row"><strong>₹${Number(o.total||0).toFixed(2)}</strong><a class="btn" href="order-status.html?order=${encodeURIComponent(o.id)}">Track Order</a></div></article>`).join(''):'<div class="empty"><h2>No orders yet</h2><p class="muted">Your completed orders will appear here.</p><a class="btn" href="menu.html">Browse Menu</a></div>';</script></body></html>
