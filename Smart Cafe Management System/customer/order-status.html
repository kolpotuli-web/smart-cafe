<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartCafe | Order Tracking</title><style>body{margin:0;background:#faf7f1;color:#18243a;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between}.top a{color:#18243a;font-weight:700}.brand{font-size:25px;font-weight:800;text-decoration:none}.brand span{color:#e88924}.card{background:#fff;border:1px solid #e5ded2;border-radius:20px;padding:25px;margin-top:20px}.badge{display:inline-block;padding:8px 12px;border-radius:999px;background:#fff2df;color:#a85f18;font-weight:800;font-size:12px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:30px 0}.step{text-align:center;color:#8a8f99}.dot{width:40px;height:40px;border-radius:50%;background:#ebe7df;margin:0 auto 8px;display:grid;place-items:center;font-weight:800}.done{color:#18243a}.done .dot{background:#e88924;color:#fff}.items{border-top:1px solid #eee7dd;margin-top:20px;padding-top:15px}.item{padding:9px 0;display:flex;justify-content:space-between;gap:10px}.muted{color:#697386}.actions{display:flex;gap:10px;margin-top:25px}.btn{flex:1;text-align:center;padding:13px;border-radius:10px;border:1px solid #ddd4c7;text-decoration:none;color:#18243a;font-weight:800}.primary{background:#e88924;color:#fff;border-color:#e88924}@media(max-width:600px){.steps{grid-template-columns:repeat(2,1fr)}.actions{flex-direction:column}}</style></head><body><div class="wrap"><header class="top"><a class="brand" href="../../index.html" aria-label="Return to SmartCafe main page">Smart<span>Cafe</span></a><a href="orders.html">My Orders</a></header><section id="app" class="card"></section></div><script>const statuses=['ORDER RECEIVED','PREPARING','READY','COMPLETED'];function read(){try{return JSON.parse(localStorage.getItem('smartCafeOrders')||'[]')}catch{return[]}}function render(){const id=new URLSearchParams(location.search).get('order')||localStorage.getItem('smartCafeLastOrderId'),o=read().find(x=>x.id===id),box=document.getElementById('app');if(!o){box.innerHTML='<h1>No order selected</h1><p class="muted">Place an order first to track it.</p><div class="actions"><a class="btn primary" href="menu.html">Browse Menu</a></div>';return}const current=Math.max(0,statuses.indexOf(o.status));box.innerHTML=`<h1>Order #${o.id}</h1><p class="muted">Table ${o.table} · ${new Date(o.createdAt).toLocaleString()}</p><span class="badge">${o.status}</span><div class="steps">${statuses.map((s,i)=>`<div class="step ${i<=current?'done':''}"><div class="dot">${i<=current?'✓':i+1}</div><small>${s}</small></div>`).join('')}</div><h2>Order Summary</h2><div class="items">${(o.items||[]).map(x=>`<div class="item"><span>${x.name||x[0]} × ${x.quantity||x[1]}${x.size&&x.size!=='Small'?' · '+x.size:''}</span><strong>₹${Number(x.lineTotal||0).toFixed(2)}</strong></div>`).join('')}</div><div class="item"><strong>Total</strong><strong>₹${Number(o.total||0).toFixed(2)}</strong></div><div class="actions"><a class="btn" href="menu.html">Order More</a><a class="btn primary" href="orders.html">My Orders</a></div>`}render();window.addEventListener('storage',render);setInterval(render,3000);</script></body></html>
