<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartCafe | Order Tracking</title><style>body{margin:0;background:#f8f5ef;color:#18243a;font-family:Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:28px 20px}.card{background:#fff;border:1px solid #e5ded2;border-radius:20px;padding:25px;margin-top:20px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.badge{display:inline-block;padding:8px 12px;border-radius:999px;background:#fff2df;color:#a95d0a;font-weight:800}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:30px 0}.step{text-align:center;color:#8a8f99}.dot{width:38px;height:38px;border-radius:50%;background:#e9e5de;margin:0 auto 8px;display:grid;place-items:center;font-weight:800}.step.done{color:#18243a}.step.done .dot{background:#e88924;color:#fff}.items{border-top:1px solid #eee7dd;margin-top:20px;padding-top:15px}.row{display:flex;justify-content:space-between;margin:10px 0}.actions{display:flex;gap:10px;margin-top:25px}.btn{flex:1;padding:13px;border-radius:10px;border:1px solid #ddd4c7;text-align:center;text-decoration:none;color:#18243a;font-weight:700}.primary{background:#e88924;color:#fff;border-color:#e88924}.muted{color:#6b7280}@media(max-width:600px){.steps{grid-template-columns:repeat(2,1fr);gap:20px}.actions{flex-direction:column}}</style></head>
<body><div class="wrap"><div class="top"><strong>☕ SmartCafe</strong><a href="orders.html">My Orders</a></div><div class="card" id="app"></div></div>
<script>function getOrders(){return JSON.parse(localStorage.getItem('smartCafeOrders')||'[]')}function render(){const id=new URLSearchParams(location.search).get('order')||localStorage.getItem('smartCafeLastOrderId'),o=getOrders().find(x=>x.id===id),box=document.getElementById('app');if(!o){box.innerHTML='<h1>No order selected</h1><p class="muted">Place an order first to track it.</p><div class="actions"><a class="btn primary" href="menu.html">Browse Menu</a></div>';return}const statuses=['ORDER RECEIVED','PREPARING','READY','COMPLETED'];const current=statuses.indexOf(o.status);box.innerHTML=`<h1>Order ${o.id}</h1><p class="muted">Table ${o.table} · ${new Date(o.createdAt).toLocaleString()}</p><p><span class="badge">${o.status}</span></p><div class="steps">${statuses.map((s,i)=>`<div class="step ${i<=current?'done':''}"><div class="dot">${i<=current?'✓':i+1}</div><small>${s}</small></div>`).join('')}</div><h2>Order Summary</h2><div class="items">${(o.items||[]).map(x=>`<div class="row"><span>${x.name||x[0]} × ${x.quantity||x[1]}</span><span>₹${x.lineTotal?Number(x.lineTotal).toFixed(2):''}</span></div>`).join('')}</div><div class="row"><strong>Total</strong><strong>₹${Number(o.total||0).toFixed(2)}</strong></div><div class="actions"><a class="btn" href="menu.html">Order More</a><a class="btn primary" href="orders.html">My Orders</a></div>`}render();setInterval(render,3000);window.addEventListener('storage',render);</script></body></html>
