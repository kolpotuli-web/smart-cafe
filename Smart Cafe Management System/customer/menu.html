<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartCafe | Menu</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;background:#faf7f1;color:#18243a;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.brand{font-size:27px;font-weight:800}.brand span{color:#e88924}.table{color:#697386;margin-top:5px}.pill{background:#fff;border:1px solid #e5ded2;border-radius:999px;padding:9px 13px}.tools{display:flex;gap:10px;margin-bottom:18px}.tools input{width:100%;padding:13px 15px;border:1px solid #ddd4c7;border-radius:11px;font-size:15px}.cats{display:flex;gap:8px;overflow:auto;margin-bottom:22px}.cat{border:1px solid #ddd4c7;background:#fff;padding:10px 15px;border-radius:999px;cursor:pointer;white-space:nowrap}.cat.active{background:#18243a;color:#fff;border-color:#18243a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.food{background:#fff;border:1px solid #e7e0d5;border-radius:17px;overflow:hidden;box-shadow:0 5px 18px rgba(24,36,58,.06)}.food-media{height:190px;background:#eee;overflow:hidden}.food-media img{width:100%;height:100%;object-fit:cover}.body{padding:18px}.body h2{font-size:20px;margin:0 0 5px}.desc{color:#697386;font-size:14px;line-height:1.5;min-height:42px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:17px}.price{font-size:18px;font-weight:800}.btn{border:0;border-radius:10px;padding:11px 15px;background:#e88924;color:#fff;font-weight:800;cursor:pointer}.empty{grid-column:1/-1;background:#fff;border:1px dashed #ddd4c7;border-radius:16px;padding:45px;text-align:center;color:#697386}.empty h2{color:#18243a}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.top{align-items:flex-start}.grid{grid-template-columns:1fr}.food-media{height:200px}}</style></head><body><div class="wrap"><header class="top"><div><div class="brand">☕ Smart<span>Cafe</span></div><div class="table">Ordering for <strong id="table">Table --</strong></div></div><a class="pill" href="cart.html">🛒 Cart <strong id="count">0</strong></a></header><div class="tools"><input id="search" type="search" placeholder="Search coffee, snacks, meals..." aria-label="Search menu"></div><div id="cats" class="cats"></div><main id="menu" class="grid" aria-live="polite"></main></div><script src="js/data.js"></script><script src="js/common.js"></script><script>const items=window.SmartCafeData.menu;let category='All';function imageFor(x){return x.image||'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=900&q=80'}function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=items.filter(x=>(category==='All'||x.category===category)&&(!q||`${x.name} ${x.description} ${x.category}`.toLowerCase().includes(q)));document.getElementById('menu').innerHTML=list.length?list.map(x=>`<article class="food"><div class="food-media"><img src="${imageFor(x)}" alt="${x.name}" loading="lazy"></div><div class="body"><h2>${x.name}</h2><div class="desc">${x.description}</div><div class="bottom"><span class="price">₹${x.price}</span><button class="btn" onclick="openItem('${x.id}')">Customize</button></div></div></article>`).join(''):'<div class="empty"><h2>No items found</h2><p>Try another category or search term.</p></div>'}function openItem(id){location.href='food.html?id='+encodeURIComponent(id)+'&table='+encodeURIComponent(SmartCafeCommon.getTable())}function update(){document.getElementById('table').textContent='Table '+SmartCafeCommon.getTable();document.getElementById('count').textContent=SmartCafeCommon.cartCount()}document.getElementById('cats').innerHTML=SmartCafeData.categories.map(c=>`<button class="cat ${c==='All'?'active':''}" onclick="category='${c}';document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active'));this.classList.add('active');render()">${c}</button>`).join('');document.getElementById('search').addEventListener('input',render);update();render();</script></body></html>
