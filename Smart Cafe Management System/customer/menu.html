<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SmartCafe customer menu">
<title>SmartCafe | Menu</title>
<link rel="stylesheet" href="css/style.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#18243a;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px 20px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:32px}.brand{font-size:29px;font-weight:800;text-decoration:none;color:#18243a;letter-spacing:-1px}.brand span{color:#e88924}.table{margin-top:6px;color:#697386;font-size:14px}.cart{display:inline-flex;align-items:center;gap:8px;background:#18243a;color:#fff;text-decoration:none;padding:11px 15px;border-radius:11px;font-weight:800}.cart-count{min-width:23px;text-align:center;padding:2px 6px;border-radius:999px;background:#e88924}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.heading h1{font-size:42px;letter-spacing:-1.5px;margin:0 0 6px}.heading p{margin:0;color:#697386}.search{position:relative;margin-bottom:16px}.search input{width:100%;height:50px;padding:0 16px;border:1px solid #dcd3c7;border-radius:12px;background:#fff;font-size:15px;color:#18243a;outline:none}.search input:focus{border-color:#e88924;box-shadow:0 0 0 3px rgba(232,137,36,.12)}.categories{display:flex;gap:9px;overflow-x:auto;padding:2px 0 8px;margin-bottom:25px}.category{border:1px solid #ddd4c7;background:#fff;color:#596477;padding:10px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:700}.category:hover{border-color:#cbb9a7}.category.active{background:#18243a;border-color:#18243a;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.food{background:#fff;border:1px solid #e5ded2;border-radius:18px;overflow:hidden;box-shadow:0 7px 24px rgba(24,36,58,.06);display:flex;flex-direction:column;min-width:0}.food-media{height:210px;background:#eee8df;overflow:hidden}.food-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}.food:hover .food-media img{transform:scale(1.035)}.body{padding:19px;display:flex;flex-direction:column;flex:1}.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.category-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:#b96516}.availability{font-size:11px;font-weight:800;color:#3d7254}.availability.unavailable{color:#b64b35}.body h2{font-size:21px;margin:0 0 7px;letter-spacing:-.3px}.desc{color:#697386;font-size:14px;line-height:1.55;min-height:44px;margin:0}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:18px}.price{font-size:20px;font-weight:800}.price small{font-size:11px;color:#818999;font-weight:600}.btn{border:0;border-radius:10px;padding:11px 16px;background:#e88924;color:#fff;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(.96)}.btn:disabled{background:#b9b2aa;cursor:not-allowed}.empty{grid-column:1/-1;background:#fff;border:1px dashed #d8cec1;border-radius:17px;padding:55px 25px;text-align:center}.empty h2{margin:0 0 8px}.empty p{margin:0;color:#697386}.footer{margin-top:35px;padding-top:20px;border-top:1px solid #e5ded2;color:#818999;font-size:12px;text-align:center}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.wrap{padding:18px 14px 45px}.top{align-items:flex-start;margin-bottom:25px}.heading{display:block}.heading h1{font-size:35px}.grid{grid-template-columns:1fr}.food-media{height:220px}.cart{padding:10px 12px}.brand{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div>
    <a class="brand" href="../../index.html" aria-label="Return to SmartCafe main page">Smart<span>Cafe</span></a>
    <div class="table">Ordering for <strong id="table">Table --</strong></div>
  </div>
  <a class="cart" href="cart.html">Cart <span class="cart-count" id="count">0</span></a>
</header>
<section class="heading">
  <div><h1>Our Menu</h1><p>Choose your food, customize it and add it to your cart.</p></div>
</section>
<div class="search"><input id="search" type="search" placeholder="Search by food name, category or description" aria-label="Search menu"></div>
<div id="cats" class="categories" role="tablist" aria-label="Menu categories"></div>
<main id="menu" class="grid" aria-live="polite"></main>
<div class="footer">SmartCafe customer menu · Prices shown in Indian Rupees</div>
</div>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
const items=window.SmartCafeData.menu;let category='All';
function imageFor(item){return item.image||'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=900&q=80'}
function money(value){return '₹'+Number(value).toFixed(2)}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=items.filter(item=>(category==='All'||item.category===category)&&(!q||`${item.name} ${item.description} ${item.category}`.toLowerCase().includes(q)));const menu=document.getElementById('menu');if(!list.length){menu.innerHTML='<div class="empty"><h2>No items found</h2><p>Try a different search or select another category.</p></div>';return}menu.innerHTML=list.map(item=>`<article class="food"><div class="food-media"><img src="${imageFor(item)}" alt="${item.name}" loading="lazy"></div><div class="body"><div class="meta"><span class="category-label">${item.category}</span><span class="availability ${item.available?'':'unavailable'}">${item.available?'Available':'Unavailable'}</span></div><h2>${item.name}</h2><p class="desc">${item.description}</p><div class="bottom"><span class="price">${money(item.price)} <small>starting price</small></span><button class="btn" ${item.available?'':'disabled'} onclick="openItem('${item.id}')">${item.available?'Customize':'Unavailable'}</button></div></div></article>`).join('')}
function openItem(id){const item=items.find(x=>x.id===id);if(!item||!item.available)return;location.href='food.html?id='+encodeURIComponent(id)+'&table='+encodeURIComponent(SmartCafeCommon.getTable())}
function updateHeader(){document.getElementById('table').textContent='Table '+SmartCafeCommon.getTable();document.getElementById('count').textContent=SmartCafeCommon.cartCount()}
document.getElementById('cats').innerHTML=SmartCafeData.categories.map(c=>`<button class="category ${c==='All'?'active':''}" role="tab" aria-selected="${c==='All'}" onclick="selectCategory('${c}',this)">${c}</button>`).join('');
function selectCategory(value,button){category=value;document.querySelectorAll('.category').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')});button.classList.add('active');button.setAttribute('aria-selected','true');render()}
document.getElementById('search').addEventListener('input',render);updateHeader();render();
</script>
</body>
</html>
