
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartCafe — Kitchen Display</title>

<style>
:root {
  --navy: #101b2d;
  --cream: #f7f4ee;
  --paper: #fff;
  --amber: #e58b2a;
  --green: #4c8b5a;
  --blue: #4f78a8;
  --red: #b65a54;
  --ink: #172033;
  --muted: #6d7480;
  --line: #e3ded4;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   TOP BAR
========================= */

.top {
  background: var(--navy);
  color: #fff;
  min-height: 72px;
  padding: 0 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-size: 22px;
  font-weight: 800;
  line-height: 1;
}

.brand span {
  color: #f3a34c;
}

.top small {
  color: #bdc6d3;
  font-size: 11px;
  letter-spacing: 0.5px;
}

/* =========================
   MAIN CONTAINER
========================= */

.container {
  width: min(1180px, 90%);
  margin: 0 auto;
  padding: 42px 0 55px;
}

/* =========================
   HEADING
========================= */

.heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 28px;
}

.eyebrow {
  margin: 0 0 8px;
  color: #a85f18;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.7px;
}

.heading h1 {
  margin: 0;
  font-size: 42px;
  line-height: 1.1;
}

.live {
  flex-shrink: 0;
  font-size: 12px;
  color: var(--green);
  font-weight: 800;
  background: #edf6ef;
  border: 1px solid #cfe4d3;
  padding: 9px 12px;
  border-radius: 999px;
  white-space: nowrap;
}

/* =========================
   SEARCH
========================= */

.toolbar {
  width: 100%;
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.toolbar input {
  width: 100%;
  height: 46px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  color: var(--ink);
  font-size: 14px;
  outline: none;
}

.toolbar input:focus {
  border-color: #bdb6a9;
}

/* =========================
   STATISTICS
========================= */

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 28px;
}

.stat {
  min-height: 92px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.stat b {
  display: block;
  font-size: 27px;
  line-height: 1;
  margin-bottom: 7px;
}

.stat span {
  font-size: 12px;
  color: var(--muted);
}

/* =========================
   FILTERS
========================= */

.filters {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.filter {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 9px;
  padding: 9px 14px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  line-height: 1;
}

.filter.active {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

/* =========================
   ORDERS GRID
========================= */

.orders {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  align-items: start;
}

/* =========================
   ORDER CARD
========================= */

.order {
  min-width: 0;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 7px 22px rgba(16, 27, 45, 0.05);
}

.order.new-order {
  animation: pulse 1s ease-in-out 2;
}

@keyframes pulse {
  50% {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(229, 139, 42, 0.2);
  }
}

/* =========================
   ORDER HEADER
========================= */

.order-head {
  min-height: 48px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.order-head > div {
  min-width: 0;
}

.order h2 {
  font-size: 22px;
  line-height: 1.15;
  margin: 0 0 5px;
}

.table {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.2;
}

.status {
  flex-shrink: 0;
  font-size: 11px;
  line-height: 1;
  font-weight: 800;
  padding: 7px 9px;
  border-radius: 999px;
  white-space: nowrap;
}

.new {
  background: #fff2df;
  color: #a85f18;
}

.preparing {
  background: #eaf1fb;
  color: #416d9d;
}

.ready {
  background: #edf6ef;
  color: #3f754b;
}

.completed {
  background: #eef0f2;
  color: #616a75;
}

/* =========================
   ORDER ITEMS
========================= */

.items {
  min-height: 108px;
  margin: 22px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 13px 0;
}

.items div {
  padding: 7px 0;
  font-size: 14px;
  line-height: 1.45;
}

.items span {
  color: var(--muted);
}

/* =========================
   ORDER META
========================= */

.meta {
  min-height: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 15px;
}

.meta span {
  min-width: 0;
}

.meta span:last-child {
  text-align: right;
}

/* =========================
   ACTION BUTTONS
========================= */

.actions {
  min-height: 38px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.actions button {
  border: 0;
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  line-height: 1;
}

.accept {
  background: #fff2df;
  color: #9c5a18;
}

.ready-btn {
  background: #edf6ef;
  color: #3f754b;
}

.done {
  background: #eef0f2;
  color: #505965;
}

/* =========================
   EMPTY STATE
========================= */

.empty {
  grid-column: 1 / -1;
  background: #fff;
  border: 1px dashed var(--line);
  border-radius: 15px;
  padding: 40px;
  text-align: center;
  color: var(--muted);
}

/* =========================
   TABLET
========================= */

@media (max-width: 900px) {

  .orders {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .heading h1 {
    font-size: 38px;
  }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .top {
    min-height: 64px;
    padding: 0 5%;
  }

  .top small {
    display: none;
  }

  .container {
    width: 92%;
    padding: 30px 0 45px;
  }

  .heading {
    align-items: flex-start;
    flex-direction: column;
    gap: 14px;
  }

  .heading h1 {
    font-size: 34px;
  }

  .live {
    align-self: flex-start;
  }

  .toolbar {
    flex-direction: column;
  }

  .stats {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .stat {
    min-height: 86px;
    padding: 15px;
  }

  .stat b {
    font-size: 24px;
  }

  .orders {
    grid-template-columns: 1fr;
    gap: 15px;
  }

  .order {
    padding: 18px;
  }
}

/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 400px) {

  .stats {
    grid-template-columns: 1fr;
  }

  .heading h1 {
    font-size: 30px;
  }

  .order-head {
    gap: 8px;
  }

  .status {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="brand">Smart<span>Cafe</span></div>
  <small>KITCHEN DISPLAY SYSTEM · DEMO</small>
</header>

<main class="container">

  <div class="heading">
    <div>
      <p class="eyebrow">STAFF OPERATIONS</p>
      <h1>Kitchen Display System</h1>
    </div>

    <div class="live">● System Active</div>
  </div>

  <div class="toolbar">
    <input
      id="search"
      type="search"
      placeholder="Search order or table..."
      aria-label="Search kitchen orders"
    >
  </div>

  <section class="stats">

    <div class="stat">
      <b id="newCount">0</b>
      <span>NEW ORDERS</span>
    </div>

    <div class="stat">
      <b id="prepCount">0</b>
      <span>PREPARING</span>
    </div>

    <div class="stat">
      <b id="readyCount">0</b>
      <span>READY</span>
    </div>

    <div class="stat">
      <b id="doneCount">0</b>
      <span>COMPLETED</span>
    </div>

  </section>

  <div class="filters">
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="ORDER RECEIVED">New</button>
    <button class="filter" data-filter="PREPARING">Preparing</button>
    <button class="filter" data-filter="READY">Ready</button>
    <button class="filter" data-filter="COMPLETED">Completed</button>
  </div>

  <section class="orders" id="orders"></section>

</main>

<script>

const seed = [
  {
    id: 'SC1025',
    table: '04',
    items: [
      { name: 'Cappuccino', quantity: 2 },
      { name: 'Veg Sandwich', quantity: 1 },
      { name: 'French Fries', quantity: 1 }
    ],
    createdAt: new Date().toISOString(),
    status: 'PREPARING'
  },
  {
    id: 'SC1024',
    table: '02',
    items: [
      { name: 'Cafe Latte', quantity: 1 },
      { name: 'Veg Sandwich', quantity: 2 }
    ],
    createdAt: new Date().toISOString(),
    status: 'ORDER RECEIVED'
  },
  {
    id: 'SC1023',
    table: '07',
    items: [
      { name: 'Cold Coffee', quantity: 2 },
      { name: 'Chocolate Brownie', quantity: 1 }
    ],
    createdAt: new Date().toISOString(),
    status: 'READY'
  }
];

let stored = localStorage.getItem('smartCafeOrders');

let orders = stored
  ? JSON.parse(stored)
  : seed;

let filter = 'all';
let query = '';

let previousNew =
  orders.filter(
    o => o.status === 'ORDER RECEIVED'
  ).length;

function save() {

  localStorage.setItem(
    'smartCafeOrders',
    JSON.stringify(orders)
  );

  localStorage.setItem(
    'smartCafeOrdersUpdatedAt',
    Date.now()
  );
}

function setStatus(id, status) {

  const o = orders.find(
    x => x.id === id
  );

  if (o) {

    o.status = status;

    o.updatedAt =
      new Date().toISOString();

    save();
    render();
  }
}

function itemParts(item) {

  if (Array.isArray(item)) {
    return {
      name: item[0],
      quantity: item[1]
    };
  }

  return {
    name: item.name,
    quantity: item.quantity || 1,
    size: item.size
  };
}

function render() {

  const list = orders.filter(
    o =>
      (filter === 'all' ||
        o.status === filter) &&
      (
        !query ||
        `${o.id} ${o.table}`
          .toLowerCase()
          .includes(query)
      )
  );

  document.getElementById('orders').innerHTML =
    list.length
      ? list.map(o => `

        <article
          class="order ${
            o.status === 'ORDER RECEIVED'
              ? 'new-order'
              : ''
          }"
        >

          <div class="order-head">

            <div>
              <h2>#${o.id}</h2>
              <div class="table">
                Table ${o.table}
              </div>
            </div>

            <span
              class="status ${
                o.status === 'ORDER RECEIVED'
                  ? 'new'
                  : o.status.toLowerCase()
              }"
            >
              ${o.status}
            </span>

          </div>

          <div class="items">

            ${(o.items || []).map(raw => {

              const i = itemParts(raw);

              return `
                <div>

                  <strong>
                    ${i.quantity}×
                  </strong>

                  ${i.name}

                  ${
                    i.size &&
                    i.size !== 'Small'
                      ? ` <span>(${i.size})</span>`
                      : ''
                  }

                  ${
                    raw.extras?.length
                      ? `
                        <br>
                        <span>
                          Extras:
                          ${
                            raw.extras
                              .map(e => e.name)
                              .join(', ')
                          }
                        </span>
                      `
                      : ''
                  }

                  ${
                    raw.instructions
                      ? `
                        <br>
                        <span>
                          Note:
                          ${raw.instructions}
                        </span>
                      `
                      : ''
                  }

                </div>
              `;

            }).join('')}

          </div>

          <div class="meta">

            <span>
              Received
              ${
                new Date(
                  o.createdAt || Date.now()
                ).toLocaleTimeString(
                  [],
                  {
                    hour: '2-digit',
                    minute: '2-digit'
                  }
                )
              }
            </span>

            <span>
              ${o.customerName || 'Walk-in'}
            </span>

          </div>

          <div class="actions">

            ${
              o.status === 'ORDER RECEIVED'
                ? `
                  <button
                    class="accept"
                    onclick="setStatus(
                      '${o.id}',
                      'PREPARING'
                    )"
                  >
                    Accept & Prepare
                  </button>
                `
                : ''
            }

            ${
              o.status === 'PREPARING'
                ? `
                  <button
                    class="ready-btn"
                    onclick="setStatus(
                      '${o.id}',
                      'READY'
                    )"
                  >
                    Mark Ready
                  </button>
                `
                : ''
            }

            ${
              o.status === 'READY'
                ? `
                  <button
                    class="done"
                    onclick="setStatus(
                      '${o.id}',
                      'COMPLETED'
                    )"
                  >
                    Complete
                  </button>
                `
                : ''
            }

            ${
              o.status === 'COMPLETED'
                ? `
                  <span class="status completed">
                    Completed
                  </span>
                `
                : ''
            }

          </div>

        </article>

      `).join('')

      : `
        <div class="empty">
          No orders in this view.
        </div>
      `;

  document.getElementById('newCount').textContent =
    orders.filter(
      o => o.status === 'ORDER RECEIVED'
    ).length;

  document.getElementById('prepCount').textContent =
    orders.filter(
      o => o.status === 'PREPARING'
    ).length;

  document.getElementById('readyCount').textContent =
    orders.filter(
      o => o.status === 'READY'
    ).length;

  document.getElementById('doneCount').textContent =
    orders.filter(
      o => o.status === 'COMPLETED'
    ).length;
}

document
  .querySelectorAll('.filter')
  .forEach(button => {

    button.addEventListener(
      'click',
      () => {

        document
          .querySelectorAll('.filter')
          .forEach(x =>
            x.classList.remove('active')
          );

        button.classList.add('active');

        filter = button.dataset.filter;

        render();
      }
    );

  });

document
  .getElementById('search')
  .addEventListener(
    'input',
    event => {

      query =
        event.target.value
          .toLowerCase()
          .trim();

      render();
    }
  );

window.addEventListener(
  'storage',
  () => {

    const fresh =
      JSON.parse(
        localStorage.getItem(
          'smartCafeOrders'
        ) || '[]'
      );

    if (fresh.length) {

      orders = fresh;

      render();
    }
  }
);

render();

</script>

</body>
</html>
