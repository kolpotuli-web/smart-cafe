<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartCafe — Kitchen Display</title>
<style>
:root{--navy:#101b2d;--cream:#f7f4ee;--paper:#fff;--amber:#e58b2a;--green:#4c8b5a;--blue:#4f78a8;--red:#b65a54;--ink:#172033;--muted:#6d7480;--line:#e3ded4}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.shell{min-height:100vh}.top{background:var(--navy);color:#fff;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800}.brand span{color:#f3a34c}.top small{color:#bdc6d3}.container{width:min(1180px,90%);margin:auto;padding:42px 0}.heading{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:28px}.eyebrow{margin:0 0 8px;color:#a85f18;font-size:12px;font-weight:800;letter-spacing:1.7px}.heading h1{margin:0;font-size:42px}.live{font-size:12px;color:var(--green);font-weight:800;background:#edf6ef;border:1px solid #cfe4d3;padding:9px 12px;border-radius:999px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{display:block;font-size:27px;margin-bottom:4px}.stat span{font-size:12px;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.filter{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer}.filter.active{background:var(--navy);color:#fff;border-color:var(--navy)}.orders{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.order{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 7px 22px rgba(16,27,45,.05)}.order-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.order h2{font-size:22px;margin:0 0 5px}.table{color:var(--muted);font-size:13px}.status{font-size:11px;font-weight:800;padding:7px 9px;border-radius:999px}.new{background:#fff2df;color:#a85f18}.preparing{background:#eaf1fb;color:#416d9d}.ready{background:#edf6ef;color:#3f754b}.completed{background:#eef0f2;color:#616a75}.items{margin:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0}.items div{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}.items span{color:var(--muted)}.time{font-size:12px;color:var(--muted);margin-bottom:15px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:0;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer}.accept{background:#fff2df;color:#9c5a18}.prep{background:#eaf1fb;color:#416d9d}.ready-btn{background:#edf6ef;color:#3f754b}.done{background:#eef0f2;color:#505965}.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--line);border-radius:15px;padding:40px;text-align:center;color:var(--muted)}@media(max-width:900px){.orders{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.heading{align-items:start;flex-direction:column}.heading h1{font-size:34px}.orders{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div class="brand">Smart<span>Cafe</span></div><small>KITCHEN DISPLAY SYSTEM · DEMO</small></header><main class="container"><div class="heading"><div><p class="eyebrow">STAFF OPERATIONS</p><h1>Kitchen Display System</h1></div><div class="live">● System Active</div></div><section class="stats"><div class="stat"><b id="newCount">0</b><span>NEW ORDERS</span></div><div class="stat"><b id="prepCount">0</b><span>PREPARING</span></div><div class="stat"><b id="readyCount">0</b><span>READY</span></div><div class="stat"><b id="doneCount">0</b><span>COMPLETED</span></div></section><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="ORDER RECEIVED">New</button><button class="filter" data-filter="PREPARING">Preparing</button><button class="filter" data-filter="READY">Ready</button><button class="filter" data-filter="COMPLETED">Completed</button></div><section class="orders" id="orders"></section></main></div>
<script>
const seed=[{id:'SC1025',table:'04',items:[['Cappuccino',2],['Veg Sandwich',1],['French Fries',1]],time:'10:42 AM',status:'PREPARING'},{id:'SC1024',table:'02',items:[['Cafe Latte',1],['Veg Sandwich',2]],time:'10:38 AM',status:'ORDER RECEIVED'},{id:'SC1023',table:'07',items:[['Cold Coffee',2],['Chocolate Brownie',1]],time:'10:31 AM',status:'READY'}];
let orders=JSON.parse(localStorage.getItem('smartCafeOrders')||'null')||seed;let filter='all';
function save(){localStorage.setItem('smartCafeOrders',JSON.stringify(orders))}
function setStatus(id,status){const o=orders.find(x=>x.id===id);if(o){o.status=status;save();render()}}
function render(){const list=orders.filter(o=>filter==='all'||o.status===filter);document.getElementById('orders').innerHTML=list.length?list.map(o=>`<article class="order"><div class="order-head"><div><h2>#${o.id}</h2><div class="table">Table ${o.table}</div></div><span class="status ${o.status==='ORDER RECEIVED'?'new':o.status.toLowerCase()}">${o.status}</span></div><div class="items">${o.items.map(i=>`<div><span>${i[0]} × ${i[1]}</span></div>`).join('')}</div><div class="time">Received ${o.time}</div><div class="actions">${o.status==='ORDER RECEIVED'?`<button class="accept" onclick="setStatus('${o.id}','PREPARING')">Accept & Prepare</button>`:''}${o.status==='PREPARING'?`<button class="ready-btn" onclick="setStatus('${o.id}','READY')">Mark Ready</button>`:''}${o.status==='READY'?`<button class="done" onclick="setStatus('${o.id}','COMPLETED')">Complete</button>`:''}${o.status==='COMPLETED'?'<span class="status completed">Completed</span>':''}</div></article>`).join(''):'<div class="empty">No orders in this view.</div>';document.getElementById('newCount').textContent=orders.filter(o=>o.status==='ORDER RECEIVED').length;document.getElementById('prepCount').textContent=orders.filter(o=>o.status==='PREPARING').length;document.getElementById('readyCount').textContent=orders.filter(o=>o.status==='READY').length;document.getElementById('doneCount').textContent=orders.filter(o=>o.status==='COMPLETED').length}
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()}));render();
</script></body></html>
