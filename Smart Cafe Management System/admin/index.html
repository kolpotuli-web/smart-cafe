<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cafe Management System | Admin</title>

  <style>
    body {
      margin: 0;
      background: #f7f4ee;
      color: #172033;
      font: 15px Arial, sans-serif;
    }

    .top {
      background: #101b2d;
      color: #fff;
      padding: 20px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
    }

    .brand span {
      color: #f3a34c;
    }

    .top a {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
    }

    .wrap {
      width: min(1150px, 90%);
      margin: auto;
      padding: 42px 0;
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 25px;
    }

    .ey {
      color: #a85f18;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .head h1 {
      font-size: 44px;
      margin: 5px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .card,
    .panel {
      background: #fff;
      border: 1px solid #e3ded4;
      border-radius: 15px;
      padding: 20px;
    }

    .card b {
      display: block;
      font-size: 28px;
    }

    .card span,
    .muted {
      color: #6d7480;
      font-size: 12px;
    }

    .panel {
      margin-top: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 0;
      border-top: 1px solid #eee;
    }

    .badge {
      padding: 6px 9px;
      border-radius: 999px;
      background: #edf6ef;
      color: #3f754b;
      font-size: 11px;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      padding: 30px;
    }

    .links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .btn {
      padding: 10px 14px;
      background: #e58b2a;
      color: #fff;
      border-radius: 9px;
      text-decoration: none;
      font-weight: 800;
    }

    @media (max-width: 750px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }

      .head {
        display: block;
      }

      .head h1 {
        font-size: 35px;
      }
    }

    @media (max-width: 450px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="brand">Smart<span>Cafe</span></div>
    <div>
      <a href="../../index.html">← Main</a>
    </div>
  </header>

  <main class="wrap">
    <div class="head">
      <div>
        <div class="ey">BUSINESS OVERVIEW</div>
        <h1>Admin Dashboard</h1>
      </div>
      <span class="badge">● Live browser data</span>
    </div>

    <section class="grid">
      <div class="card">
        <b id="orders">0</b>
        <span>TOTAL ORDERS</span>
      </div>

      <div class="card">
        <b id="active">0</b>
        <span>ACTIVE ORDERS</span>
      </div>

      <div class="card">
        <b id="revenue">₹0</b>
        <span>ORDER VALUE</span>
      </div>

      <div class="card">
        <b>12</b>
        <span>TABLES</span>
      </div>
    </section>

    <section class="panel">
      <h2>Recent Orders</h2>
      <div id="recent"></div>

      <div class="links">
        <a class="btn" href="../kitchen.html">Kitchen Display</a>
        <a class="btn" href="../customer/index.html">Customer</a>
      </div>
    </section>
  </main>

  <script>
    function read() {
      try {
        return JSON.parse(localStorage.getItem('smartCafeOrders') || '[]');
      } catch {
        return [];
      }
    }

    function render() {
      const orders = read();

      document.getElementById('orders').textContent = orders.length;
      document.getElementById('active').textContent = orders.filter(
        o => o.status !== 'COMPLETED'
      ).length;
      document.getElementById('revenue').textContent =
        '₹' + orders.reduce((s, o) => s + Number(o.total || 0), 0).toFixed(2);

      document.getElementById('recent').innerHTML = orders.length
        ? orders.slice(0, 10).map(o => `
          <div class="row">
            <span>
              <strong>#${o.id}</strong>
              <br>
              <span class="muted">
                Table ${o.table}${o.customerName ? ' · ' + o.customerName : ''}
              </span>
            </span>
            <span class="badge">${o.status}</span>
          </div>
        `).join('')
        : '<div class="empty muted">No orders yet. Place an order from the customer screen.</div>';
    }

    render();
    window.addEventListener('storage', render);
    setInterval(render, 3000);
  </script>
</body>

</html>
