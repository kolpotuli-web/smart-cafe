<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartCafe — Admin Dashboard</title><style>body{margin:0;background:#f7f4ee;color:#172033;font:15px Arial,sans-serif}.top{background:#101b2d;color:#fff;padding:22px 6%;display:flex;justify-content:space-between}.brand{font-weight:800;font-size:22px}.brand span{color:#f3a34c}.wrap{width:min(1150px,90%);margin:auto;padding:45px 0}.ey{color:#a85f18;font-size:12px;font-weight:800;letter-spacing:2px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.head h1{font-size:44px;margin:5px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid #e3ded4;border-radius:14px;padding:20px}.card b{font-size:28px;display:block}.card span{color:#6d7480;font-size:12px}.panel{margin-top:22px;background:#fff;border:1px solid #e3ded4;border-radius:14px;padding:24px}.panel h2{margin-top:0}.row{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid #eee}.pill{background:#edf6ef;color:#3f754b;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.head{display:block}.head h1{font-size:34px}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">Smart<span>Cafe</span></div><div>ADMIN / OWNER</div></header><main class="wrap"><div class="head"><div><div class="ey">BUSINESS OVERVIEW</div><h1>Admin Dashboard</h1></div><div class="pill">● Demo data</div></div><section class="grid"><div class="card"><b id="orders">0</b><span>TOTAL ORDERS</span></div><div class="card"><b id="active">0</b><span>ACTIVE ORDERS</span></div><div class="card"><b id="revenue">₹0</b><span>ORDER VALUE</span></div><div class="card"><b id="tables">12</b><span>TABLES</span></div></section><section class="panel"><h2>Recent orders</h2><div id="recent"></div></section></main><script>const orders=JSON.parse(localStorage.getItem('smartCafeOrders')||'[]');document.getElementById('orders').textContent=orders.length;document.getElementById('active').textContent=orders.filter(o=>o.status!=='COMPLETED').length;document.getElementById('revenue').textContent='₹'+orders.reduce((s,o)=>s+Number(o.total||0),0);document.getElementById('recent').innerHTML=orders.slice(0,8).map(o=>`<div class="row"><span>#${o.id} · Table ${o.table}</span><strong>${o.status}</strong></div>`).join('')||'<div class="row"><span>No customer orders yet.</span></div>';</script></body></html>
